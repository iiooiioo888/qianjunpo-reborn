syntax = "proto3";

package qianjunpo.roma.v1;

import "common/v1/common.proto";

option go_package = "github.com/iiooiioo888/qianjunpo-reborn/gen/go/roma/v1;romav1";

// RomaZone is the CPU-deterministic authoritative battle partition (in-memory only).
// Redis MUST NOT store HP, position, or buff state — routing/cache keys only.
service RomaZone {
  rpc JoinZone(JoinZoneRequest) returns (JoinZoneResponse);
  rpc GetBattleState(GetBattleStateRequest) returns (BattleState);
  rpc SubmitCommand(SubmitCommandRequest) returns (SubmitCommandResponse);
  // Phase 2 deepen: authoritative pkg/tactical lockstep path.
  rpc SubmitTacticalCommand(SubmitTacticalCommandRequest) returns (SubmitTacticalCommandResponse);
  rpc StepLockstep(StepLockstepRequest) returns (StepLockstepResponse);
  // Display-layer JSON (pkg/tactical.ViewSnapshot) from authoritative Match.
  rpc GetTacticalViewSnapshot(GetTacticalViewSnapshotRequest) returns (GetTacticalViewSnapshotResponse);
}

message JoinZoneRequest {
  string access_token = 1;
  qianjunpo.common.v1.ZoneRef zone = 2;
}

message JoinZoneResponse {
  string battle_id = 1;
  qianjunpo.common.v1.DualTimestamp sim_time = 2;
}

message GetBattleStateRequest {
  string battle_id = 1;
}

// BattleState is authoritative Roma memory; never serialized to Redis as gameplay truth.
message BattleState {
  string battle_id = 1;
  qianjunpo.common.v1.ZoneRef zone = 2;
  uint64 state_hash = 3;
  int32 unit_count = 4;
}

message SubmitCommandRequest {
  string battle_id = 1;
  uint32 player_id = 2;
  int32 move_x = 3;
  int32 move_y = 4;
}

message SubmitCommandResponse {
  bool accepted = 1;
  uint64 state_hash = 2;
}

// TacticalCommand mirrors pkg/tactical.Command (grid coords are 0..18).
message TacticalCommand {
  uint32 player_id = 1;
  uint32 kind = 2; // 1=move, 2=attack, 3=pass
  uint32 unit_id = 3;
  int32 to_x = 4;
  int32 to_y = 5;
}

message SubmitTacticalCommandRequest {
  string battle_id = 1;
  TacticalCommand command = 2;
}

message SubmitTacticalCommandResponse {
  bool accepted = 1;
  string reject_reason = 2;
  uint64 state_hash = 3;
  uint64 lockstep_frame = 4;
}

message StepLockstepRequest {
  string battle_id = 1;
  uint32 steps = 2;
}

message StepLockstepResponse {
  uint64 lockstep_frame = 1;
  uint64 state_hash = 2;
  bool finished = 3;
  uint32 winner = 4; // 255 = undecided / draw sentinel
}

message GetTacticalViewSnapshotRequest {
  string battle_id = 1;
}

// view_snapshot_json is UTF-8 JSON matching pkg/tactical.ViewSnapshot (schemaVersion=1).
message GetTacticalViewSnapshotResponse {
  bytes view_snapshot_json = 1;
  uint64 state_hash = 2;
  uint64 lockstep_frame = 3;
}
