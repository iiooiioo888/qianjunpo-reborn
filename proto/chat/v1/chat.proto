syntax = "proto3";

package qianjunpo.chat.v1;

import "common/v1/common.proto";

option go_package = "github.com/iiooiioo888/qianjunpo-reborn/gen/go/chat/v1;chatv1";

service ChatService {
  rpc Send(SendRequest) returns (SendResponse);
}

message SendRequest {
  string channel = 1;
  qianjunpo.common.v1.PlayerRef sender = 2;
  string text = 3;
}

message SendResponse {
  string message_id = 1;
  int64 wall_unix_ms = 2;
}
