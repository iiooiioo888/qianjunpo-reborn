<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>千軍破 · 戰場預覽（field）</title>
    <link rel="stylesheet" href="field.css" />
  </head>
  <body>
    <div id="app">
      <header class="top-bar">
        <h1>戰場預覽</h1>
        <p class="subtitle">獨立靜態頁 · 路徑 <code>/qjp/field/</code> · 不接 Live API</p>
      </header>

      <section id="screen-deploy" class="screen">
        <h2>出征前選兵</h2>
        <p class="hint">步、弓、騎各編制一支，調整兵力後按「出征進戰場」。</p>
        <div class="deploy-panel-wrap">
          <div class="deploy-panel-art" aria-hidden="true"></div>
          <div class="troop-rows">
            <div class="troop-row" data-type="infantry">
              <img
                class="troop-stack-icon"
                src="QJP_stack_infantry_v01.png"
                width="48"
                height="56"
                alt="步兵堆"
              />
              <label>步兵</label>
              <input type="range" min="10" max="500" value="120" data-input="troops" />
              <output data-output="troops">120</output>
            </div>
            <div class="troop-row" data-type="archer">
              <img
                class="troop-stack-icon"
                src="QJP_stack_archer_v01.png"
                width="48"
                height="56"
                alt="弓兵堆"
              />
              <label>弓兵</label>
              <input type="range" min="10" max="500" value="100" data-input="troops" />
              <output data-output="troops">100</output>
            </div>
            <div class="troop-row" data-type="cavalry">
              <img
                class="troop-stack-icon"
                src="QJP_stack_cavalry_v01.png"
                width="48"
                height="56"
                alt="騎兵堆"
              />
              <label>騎兵</label>
              <input type="range" min="10" max="500" value="80" data-input="troops" />
              <output data-output="troops">80</output>
            </div>
          </div>
        </div>
        <button type="button" id="btn-expedition" class="primary" disabled>出征進戰場</button>
      </section>

      <section id="screen-battle" class="screen hidden">
        <div class="battle-layout">
          <canvas id="field-canvas" width="960" height="640" aria-label="斜角戰場"></canvas>
          <aside class="side-panel">
            <h3>自動戰鬥</h3>
            <ol class="help-list">
              <li>出征後<strong>回合自動推進</strong>，無需點格移動或選目標。</li>
              <li>雙方各堆自動靠近（移動曼哈頓 ≤4）並在射程內攻擊（≤2）。</li>
              <li>傷害 <code>max(8, floor(兵力×0.25))</code>；敵方會反擊；受擊堆上方紅字扣兵。</li>
              <li>一方合計兵力歸零即結束，畫布顯示勝／負並鎖定。</li>
            </ol>
            <p id="status-line" class="status">自動戰鬥進行中…</p>
            <button type="button" id="btn-back-deploy" class="secondary">返回選兵</button>
          </aside>
        </div>
      </section>
    </div>
    <script type="module" src="field-main.js"></script>
  </body>
</html>
