<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>千軍破 · 戰術棋盤 static-preview</title>
    <!-- Dev 掛載 http://47.79.23.223/qjp/ 時取消下一行註解（不佔 Linkin :80 根路徑） -->
    <!-- <base href="/qjp/" /> -->
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="wrap">
      <h1>《千軍破》戰術棋盤 · static-preview</h1>
      <p class="sub">
        純靜態預覽（非 Cocos）。預設 <code>mock/demo_initial.json</code>；<code>?live=1</code> 可同域暫定 <code>POST v1/lares/login</code> 取 token 後走 <code>v1/tactical/*</code>（亦可手動 <code>?accessToken=…</code>）。
      </p>
      <section class="hud" aria-live="polite">
        <p id="hud-rate">timeFlowRateParts: —</p>
        <p id="hud-frame">lockstep frame: —</p>
        <p id="hud-selection">selected unit: —</p>
        <p id="hud-skill-cast">lastSkillCast: —</p>
        <p id="hud-mode"></p>
        <p id="hud-status">Loading…</p>
        <button type="button" id="hud-mint-token" class="mint-token" hidden>一鍵取 token</button>
        <button type="button" id="hud-cast-skill" class="cast-skill" hidden>施放 stub 技能 (Strike)</button>
        <button type="button" id="hud-retry-live" class="retry-live" hidden></button>
      </section>
      <div class="board-panel">
        <div class="board-wrap" id="board-wrap">
          <canvas id="board" width="560" height="560" aria-label="19 by 19 tactical board"></canvas>
        </div>
        <div id="char-cards" aria-label="Character cards v04"></div>
      </div>
      <footer>
        詳見 <a href="./README.md">README.md</a>（本地 <code>npx serve</code>、Dev <code>/qjp/</code> 掛載）。
      </footer>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
