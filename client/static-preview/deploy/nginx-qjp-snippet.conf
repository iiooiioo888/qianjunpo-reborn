# Dev / Linkin: static-preview under /qjp/ (see client/static-preview/README.md).
# Include from the host nginx that also reverse-proxies /qjp/v1/ → Janus HTTP.
#
# ROOT CAUSE (Chrome「HTTP 400」/ Live 壞掉): 舊配置 `return 301 /qjp/` 會剝掉 query。
# 使用者打 /qjp?live=1 或書籤無尾斜線 → 落到 /qjp/ 無 ?live=1 → 客戶端仍可能打
# GET /qjp/v1/tactical/snapshot（無 battle_id）→ Janus 回 400 missing battle_id（curl 測 HTML 仍 200）。
# 務必使用下方 $is_args$args，並用 index + try_files 避免 SPA 落進 /qjp/v1/ 反代。

location = /qjp {
    return 301 $scheme://$host/qjp/$is_args$args;
}

location ^~ /qjp/v1/ {
    proxy_pass http://127.0.0.1:18090/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location ^~ /qjp/ {
    alias /var/www/qjp-static-preview/;
    index index.html;
    # alias + try_files：最後一項為 alias 目錄內的 index.html（勿寫 /qjp/index.html 以免內部跳轉錯誤）
    try_files $uri $uri/ index.html;
    add_header Cache-Control "no-cache";
}
