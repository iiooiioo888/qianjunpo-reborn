# Dev / Linkin: static-preview under /qjp/ (see client/static-preview/README.md).
# Include from the host nginx that also reverse-proxies /qjp/v1/ → Janus HTTP.
#
# IMPORTANT: a bare `return 301 /qjp/` (or rewrite … permanent) drops query strings, so
# `/qjp?mockVictory=win` becomes `/qjp/` and mock/Live boot params vanish. Browsers may
# then hit Janus snapshot URLs without battle_id (HTTP 400 on :18093).

location = /qjp {
    return 301 $scheme://$host/qjp/$is_args$args;
}

location /qjp/ {
    alias /var/www/qjp-static-preview/;  # deploy-web-preview target; adjust on host
    try_files $uri $uri/ /qjp/index.html;
    add_header Cache-Control "no-cache";
}

location /qjp/v1/ {
    proxy_pass http://127.0.0.1:18090/v1/;  # Janus HTTP mirror; adjust per host
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
