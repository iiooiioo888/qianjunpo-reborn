services:
  app:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      MYSQL_DSN: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/qianjunpo?parseTime=true
      ETCD_ENDPOINTS: etcd:2379
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    volumes:
      - .:/src:ro
    working_dir: /app

  redis:
    profiles: ["dev"]
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data

  mysql:
    profiles: ["dev"]
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: qianjunpo
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  etcd:
    profiles: ["dev"]
    image: quay.io/coreos/etcd:v3.5.15
    command:
      - /usr/local/bin/etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd0=http://etcd:2380
      - --initial-cluster-state=new
    ports:
      - "12379:2379"

  lares:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE: lares
    environment:
      LARES_GRPC_ADDR: ":9091"
      LARES_HTTP_ADDR: ":8091"
      LARES_TOKEN_SECRET: ${LARES_TOKEN_SECRET:-phase4-dev-secret}
      ETCD_ENDPOINTS: etcd:2379
      REDIS_URL: redis://redis:6379/0
      MYSQL_DSN: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/qianjunpo?parseTime=true
    ports:
      - "19091:9091"
      - "18091:8091"
    depends_on:
      etcd:
        condition: service_started
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8091/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  roma:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE: roma
    environment:
      ROMA_GRPC_ADDR: ":9092"
      ROMA_HTTP_ADDR: ":8092"
      ROMA_ADVERTISE_ADDR: roma:9092
      ROMA_ZONE_ID: default
      ETCD_ENDPOINTS: etcd:2379
      REDIS_URL: redis://redis:6379/0
    ports:
      - "19092:9092"
      - "18092:8092"
    depends_on:
      etcd:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8092/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  janus:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE: janus
    environment:
      JANUS_GRPC_ADDR: ":9090"
      JANUS_TCP_ADDR: ":7000"
      JANUS_HTTP_ADDR: ":8090"
      ETCD_ENDPOINTS: etcd:2379
      ROMA_GRPC_ADDR: roma:9092
      JANUS_LARES_GRPC_ADDR: lares:9091
      LARES_TOKEN_SECRET: ${LARES_TOKEN_SECRET:-phase4-dev-secret}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "19090:9090"
      - "18090:8090"
      - "17000:7000"
    depends_on:
      lares:
        condition: service_healthy
      roma:
        condition: service_healthy
      etcd:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  senate:
    profiles: ["dev", "ops"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE: senate
    environment:
      SENATE_GRPC_ADDR: ":9093"
      SENATE_HTTP_ADDR: ":8093"
    ports:
      - "19093:9093"
      - "18093:8093"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8093/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  chatserver:
    profiles: ["dev", "ops"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.service
      args:
        SERVICE: chatserver
    environment:
      CHAT_GRPC_ADDR: ":9094"
      CHAT_HTTP_ADDR: ":8094"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "19094:9094"
      - "18094:8094"
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8094/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
  mysql-data:
